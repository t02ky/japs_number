<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number to Text Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <!-- 埋め込み用コンポーネント (ここからコピー可能) -->
  <div class="w-full max-w-md bg-white border border-slate-200 shadow-sm rounded-xl p-6">
    <h2 class="text-base font-semibold text-slate-900 mb-4">数値入力・テキスト出力</h2>
    
    <div class="space-y-4">
      <div>
        <label for="numberInput" class="block text-sm font-medium text-slate-700 mb-1">数値を入力</label>
        <input
          type="number"
          id="numberInput"
          placeholder="例: 12345"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
        />
      </div>

      <div class="pt-2 border-t border-slate-100">
        <span class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">出力テキスト</span>
        <div 
          id="textOutput" 
          class="min-h-[44px] px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 break-all flex items-center"
        >
          <span class="text-slate-400 italic">（入力された数値がここにテキストとして表示されます）</span>
        </div>
      </div>
    </div>
  </div>
  <!-- 埋め込み用コンポーネントここまで -->

  <script>
    // 要素の取得
    const inputElement = document.getElementById('numberInput');
    const outputElement = document.getElementById('textOutput');

    // 入力イベントの検知とテキスト反映
    inputElement.addEventListener('input', (event) => {
      const val = event.target.value.trim();

      if (val === '') {
        outputElement.innerHTML = '<span class="text-slate-400 italic">（入力された数値がここにテキストとして表示されます）</span>';
      } else {
        // テキストとして安全に出力 (textContentを利用してXSS防止)
        outputElement.textContent = String(val);
      }
    });
  </script>
</body>
</html>
